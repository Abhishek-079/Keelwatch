# Calls the snapshot job every 15 minutes (Vercel's free plan only allows daily cron jobs).
# Needs two repository secrets: SITE_URL (e.g. https://keelwatch.vercel.app) and CRON_SECRET.
name: Snapshot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger snapshot
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Set SITE_URL and CRON_SECRET secrets"; exit 1; fi
          code=$(curl -s -o out.json -w "%{http_code}" --max-time 310 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/snapshot")
          head -c 2000 out.json; echo
          test "$code" = "200"
